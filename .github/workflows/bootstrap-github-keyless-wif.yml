name: Bootstrap GitHub Actions keyless WIF

on:
  push:
    branches:
      - security/github-actions-keyless-wif-20260930

permissions:
  contents: write
  id-token: write

env:
  PROJECT_ID: gen-lang-client-0782739149
  PROJECT_NUMBER: '937250723434'
  REGION: us-central1
  SERVICE_NAME: costa-rica-tours
  WIF_POOL_ID: github-actions
  WIF_PROVIDER_ID: github
  DEPLOY_SERVICE_ACCOUNT: github-deployer@gen-lang-client-0782739149.iam.gserviceaccount.com
  REPOSITORY_SUBJECT: jarojas2026/CostaRicaTours2026
  GITHUB_WIF_PROVIDER: projects/937250723434/locations/global/workloadIdentityPools/github-actions/providers/github

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bootstrap authentication with existing key
        uses: google-github-actions/auth@v3
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Provision repository-scoped GitHub OIDC provider
        shell: bash
        run: |
          set -euo pipefail

          if ! gcloud iam workload-identity-pools describe "$WIF_POOL_ID" \
            --location=global --project "$PROJECT_ID" >/dev/null 2>&1; then
            gcloud iam workload-identity-pools create "$WIF_POOL_ID" \
              --location=global \
              --project "$PROJECT_ID" \
              --display-name='GitHub Actions production deploys' \
              --description='Keyless GitHub Actions federation for CostaRicaTours2026.'
          fi

          if ! gcloud iam workload-identity-pools providers describe "$WIF_PROVIDER_ID" \
            --workload-identity-pool="$WIF_POOL_ID" \
            --location=global \
            --project "$PROJECT_ID" >/dev/null 2>&1; then
            gcloud iam workload-identity-pools providers create-oidc "$WIF_PROVIDER_ID" \
              --workload-identity-pool="$WIF_POOL_ID" \
              --location=global \
              --project "$PROJECT_ID" \
              --display-name='GitHub Actions OIDC' \
              --issuer-uri='https://token.actions.githubusercontent.com' \
              --attribute-mapping='google.subject=assertion.sub,attribute.repository=assertion.repository,attribute.repository_owner=assertion.repository_owner,attribute.ref=assertion.ref' \
              --attribute-condition="assertion.repository == '${REPOSITORY_SUBJECT}'"
          fi

          PRINCIPAL_SET="principalSet://iam.googleapis.com/projects/${PROJECT_NUMBER}/locations/global/workloadIdentityPools/${WIF_POOL_ID}/attribute.repository/${REPOSITORY_SUBJECT}"
          gcloud iam service-accounts add-iam-policy-binding "$DEPLOY_SERVICE_ACCOUNT" \
            --project "$PROJECT_ID" \
            --member="$PRINCIPAL_SET" \
            --role='roles/iam.workloadIdentityUser' \
            --quiet

      - name: Switch this run to keyless GitHub OIDC
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.GITHUB_WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}

      - name: Verify keyless identity can read private production service
        shell: bash
        run: |
          set -euo pipefail
          ACCOUNT="$(gcloud config get-value account)"
          echo "Keyless account: $ACCOUNT"
          test "$ACCOUNT" = "$DEPLOY_SERVICE_ACCOUNT"
          SERVICE_URL="$(gcloud run services describe "$SERVICE_NAME" --region "$REGION" --project "$PROJECT_ID" --format='value(status.url)')"
          test -n "$SERVICE_URL"
          echo "GitHub OIDC federation verified against private Cloud Run metadata."

      - name: Migrate production deploy workflow to keyless-only auth
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/deploy-cloud-run.yml')
          text = path.read_text()

          old_env = '''  # Ruta preferida: Workload Identity Federation (OIDC sin llave persistente).\n  # Compatibilidad: si aún no existen estos secretos, se usa GCP_SA_KEY.\n  GCP_WIF_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}\n  GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}\n  GCP_SA_KEY_JSON: ${{ secrets.GCP_SA_KEY }}\n'''
          new_env = '''  # Keyless GitHub Actions federation. These resource identifiers are non-secret.\n  GCP_WIF_PROVIDER: projects/937250723434/locations/global/workloadIdentityPools/github-actions/providers/github\n  GCP_SERVICE_ACCOUNT: github-deployer@gen-lang-client-0782739149.iam.gserviceaccount.com\n'''
          if old_env not in text:
              raise SystemExit('Expected legacy deploy auth env block not found')
          text = text.replace(old_env, new_env, 1)

          start = text.index('      - name: Autenticar con Google Cloud — OIDC keyless (preferido)')
          end = text.index('      - name: Configurar gcloud CLI', start)
          new_auth = '''      - name: Autenticar con Google Cloud — GitHub OIDC keyless\n        uses: google-github-actions/auth@v3\n        with:\n          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}\n          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}\n\n'''
          text = text[:start] + new_auth + text[end:]
          path.write_text(text)
          PY

          cat > tests/githubOidcDeploy.contract.test.ts <<'EOF'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import path from 'node:path';
          import test from 'node:test';

          const workflow = fs.readFileSync(path.join(process.cwd(), '.github/workflows/deploy-cloud-run.yml'), 'utf8');

          test('Cloud Run deploy is GitHub OIDC keyless-only', () => {
            assert.match(workflow, /id-token: write/);
            assert.match(workflow, /workload_identity_provider:/);
            assert.match(workflow, /github-actions\/providers\/github/);
            assert.match(workflow, /github-deployer@gen-lang-client-0782739149\.iam\.gserviceaccount\.com/);
            assert.doesNotMatch(workflow, /credentials_json/);
            assert.doesNotMatch(workflow, /GCP_SA_KEY/);
          });

          test('deploy remains gated by successful main Build & Type Check', () => {
            assert.match(workflow, /workflows: \["Build & Type Check"\]/);
            assert.match(workflow, /workflow_run\.conclusion == 'success'/);
            assert.match(workflow, /workflow_run\.head_branch == 'main'/);
          });
          EOF

          rm .github/workflows/bootstrap-github-keyless-wif.yml

      - name: Install and validate final repository state
        run: |
          npm ci --include=optional --legacy-peer-deps
          npm run audit:security:prod
          node scripts/securityFixtureAudit.mjs
          npm run audit:whatsapp
          npm run test:contracts
          npm run lint
          npm run build
          git diff --check
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'
          GEMINI_API_KEY: 'ci-dummy-key'
          STRIPE_SECRET_KEY: 'sk_test_dummy'
          VITE_STRIPE_PUBLIC_KEY: 'pk_test_dummy'
          VITE_GOOGLE_MAPS_API_KEY: 'dummy-key'

      - name: Commit keyless deploy migration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/deploy-cloud-run.yml tests/githubOidcDeploy.contract.test.ts .github/workflows/bootstrap-github-keyless-wif.yml
          git commit -m 'security(gcp): deploy Cloud Run with repository-scoped GitHub OIDC'
          git push

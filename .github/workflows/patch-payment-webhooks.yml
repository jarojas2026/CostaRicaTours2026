name: Wire payment webhooks on current main

on:
  push:
    branches:
      - fix/wire-payment-webhooks-current-main

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/wire-payment-webhooks-current-main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Wire signed payment webhook handlers
        shell: python
        run: |
          from pathlib import Path

          path = Path('server.ts')
          text = path.read_text()

          import_line = "import { handleStripeWebhook, handlePayPalWebhook } from './backend/paymentWebhookHttpService';\n"
          if import_line not in text:
              anchor = "} from './backend/nativeWorkflows';\n"
              if anchor not in text:
                  raise SystemExit('nativeWorkflows import anchor not found')
              text = text.replace(anchor, anchor + import_line, 1)

          routes = """\n// Signed payment webhooks. Stripe uses the byte-exact rawBody captured by\n// express.json({ verify }) above; PayPal verifies its provider signature before\n// any booking/payment state is mutated. These routes intentionally do not use\n// application auth because the payment-provider signature is the authorization.\napp.post('/api/webhooks/stripe', handleStripeWebhook);\napp.post('/api/webhooks/paypal', handlePayPalWebhook);\n"""
          if "app.post('/api/webhooks/stripe', handleStripeWebhook);" not in text:
              anchor = "app.use('/api/', generalApiLimiter, apiAdmission.middleware);\n"
              if anchor not in text:
                  raise SystemExit('API limiter anchor not found')
              text = text.replace(anchor, anchor + routes, 1)

          path.write_text(text)

          test = Path('tests/paymentWebhookRegistration.contract.test.ts')
          test.write_text("""import assert from 'node:assert/strict';\nimport { readFileSync } from 'node:fs';\nimport test from 'node:test';\n\nconst server = readFileSync(new URL('../server.ts', import.meta.url), 'utf8');\n\ntest('signed payment webhook HTTP bridge is registered on the canonical Express server', () => {\n  assert.match(server, /paymentWebhookHttpService/);\n  assert.match(server, /app\\.post\\('\/api\/webhooks\/stripe',\\s*handleStripeWebhook\\)/);\n  assert.match(server, /app\\.post\\('\/api\/webhooks\/paypal',\\s*handlePayPalWebhook\\)/);\n});\n\ntest('Express captures raw request bytes before Stripe signature verification', () => {\n  assert.match(server, /express\\.json\\(\\{[^}]*verify:\\s*\\(req,\\s*_res,\\s*buf\\)[\\s\\S]*rawBody\\s*=\\s*Buffer\\.from\\(buf\\)/);\n});\n""")

      - name: Remove one-shot patch workflow from final tree
        run: rm .github/workflows/patch-payment-webhooks.yml

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Type check
        run: npm run lint

      - name: Contract tests
        run: npm run test:contracts

      - name: Verify diff hygiene
        run: git diff --check

      - name: Commit focused fix
        run: |
          if git diff --quiet; then
            echo 'No changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server.ts tests/paymentWebhookRegistration.contract.test.ts .github/workflows/patch-payment-webhooks.yml
          git commit -m 'fix(payments): register signed Stripe and PayPal webhooks'
          git push origin HEAD:fix/wire-payment-webhooks-current-main

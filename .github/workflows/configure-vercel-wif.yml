name: Check and Configure Vercel to Cloud Run WIF

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - '.github/workflows/configure-vercel-wif.yml'

permissions:
  contents: read

env:
  PROJECT_ID: gen-lang-client-0782739149
  REGION: us-central1
  SERVICE_NAME: costa-rica-tours
  WIF_POOL_ID: vercel
  WIF_PROVIDER_ID: vercel-production
  VERCEL_TEAM_SLUG: jarojas800-7900s-projects
  VERCEL_PROJECT_NAME: costaricatours2026
  # Reuse the existing deployment identity instead of requiring permission to
  # create another service account. This account already invokes the private
  # Cloud Run health endpoint during deployments.
  GATEWAY_SERVICE_ACCOUNT: github-deployer@gen-lang-client-0782739149.iam.gserviceaccount.com

jobs:
  configure:
    name: Check/provision least-privilege gateway identity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Authenticate with Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - name: Configure gcloud
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Verify existing Cloud Run deployment identity
        shell: bash
        run: |
          set -euo pipefail
          echo "Authenticated account: $(gcloud config get-value account)"
          echo "Project: $PROJECT_ID"
          gcloud iam service-accounts describe "$GATEWAY_SERVICE_ACCOUNT" --project "$PROJECT_ID" >/dev/null
          gcloud run services describe "$SERVICE_NAME" \
            --region "$REGION" \
            --project "$PROJECT_ID" \
            --format='value(status.url)' >/dev/null
          echo "Existing deployment identity and private Cloud Run service are readable."

      - name: Check or provision WIF resources without broadening deployer privileges
        shell: bash
        run: |
          set -uo pipefail

          PROJECT_NUMBER="$(gcloud projects describe "$PROJECT_ID" --format='value(projectNumber)')"
          SERVICE_URL="$(gcloud run services describe "$SERVICE_NAME" --region "$REGION" --project "$PROJECT_ID" --format='value(status.url)')"
          VERCEL_ISSUER="https://oidc.vercel.com/${VERCEL_TEAM_SLUG}"
          VERCEL_AUDIENCE="https://vercel.com/${VERCEL_TEAM_SLUG}"
          VERCEL_SUBJECT="owner:${VERCEL_TEAM_SLUG}:project:${VERCEL_PROJECT_NAME}:environment:production"
          WIF_AUDIENCE="//iam.googleapis.com/projects/${PROJECT_NUMBER}/locations/global/workloadIdentityPools/${WIF_POOL_ID}/providers/${WIF_PROVIDER_ID}"
          FEDERATED_PRINCIPAL="principal://iam.googleapis.com/projects/${PROJECT_NUMBER}/locations/global/workloadIdentityPools/${WIF_POOL_ID}/subject/${VERCEL_SUBJECT}"
          READY=true
          BLOCKERS=()

          if ! gcloud iam workload-identity-pools describe "$WIF_POOL_ID" --location=global --project "$PROJECT_ID" >/dev/null 2>&1; then
            echo "WIF pool is absent; attempting least-privilege creation."
            if ! gcloud iam workload-identity-pools create "$WIF_POOL_ID" \
              --location=global \
              --project "$PROJECT_ID" \
              --display-name='Vercel production workloads' \
              --description='Federated identity pool for the Costa Rica Tours Vercel production deployment.'; then
              READY=false
              BLOCKERS+=("Create Workload Identity Pool '$WIF_POOL_ID' (requires iam.workloadIdentityPools.create).")
            fi
          fi

          if [[ "$READY" == true ]] && ! gcloud iam workload-identity-pools providers describe "$WIF_PROVIDER_ID" \
            --workload-identity-pool="$WIF_POOL_ID" \
            --location=global \
            --project "$PROJECT_ID" >/dev/null 2>&1; then
            echo "Vercel OIDC provider is absent; attempting creation."
            if ! gcloud iam workload-identity-pools providers create-oidc "$WIF_PROVIDER_ID" \
              --workload-identity-pool="$WIF_POOL_ID" \
              --location=global \
              --project "$PROJECT_ID" \
              --display-name='Vercel production OIDC' \
              --issuer-uri="$VERCEL_ISSUER" \
              --allowed-audiences="$VERCEL_AUDIENCE" \
              --attribute-mapping='google.subject=assertion.sub' \
              --attribute-condition="assertion.sub == '${VERCEL_SUBJECT}'"; then
              READY=false
              BLOCKERS+=("Create OIDC provider '$WIF_PROVIDER_ID' restricted to the Vercel production subject.")
            fi
          fi

          if [[ "$READY" == true ]]; then
            if ! gcloud iam service-accounts add-iam-policy-binding "$GATEWAY_SERVICE_ACCOUNT" \
              --project "$PROJECT_ID" \
              --member="$FEDERATED_PRINCIPAL" \
              --role='roles/iam.workloadIdentityUser' \
              --quiet; then
              READY=false
              BLOCKERS+=("Grant roles/iam.workloadIdentityUser on $GATEWAY_SERVICE_ACCOUNT to the Vercel federated principal.")
            fi
          fi

          if [[ "$READY" == true ]]; then
            if ! gcloud iam service-accounts add-iam-policy-binding "$GATEWAY_SERVICE_ACCOUNT" \
              --project "$PROJECT_ID" \
              --member="$FEDERATED_PRINCIPAL" \
              --role='roles/iam.serviceAccountTokenCreator' \
              --quiet; then
              READY=false
              BLOCKERS+=("Grant roles/iam.serviceAccountTokenCreator on $GATEWAY_SERVICE_ACCOUNT to the Vercel federated principal.")
            fi
          fi

          {
            echo '## Vercel → private Cloud Run WIF readiness'
            echo
            echo "- Project number: ${PROJECT_NUMBER}"
            echo "- Cloud Run service: ${SERVICE_URL}"
            echo "- Gateway service account: ${GATEWAY_SERVICE_ACCOUNT}"
            echo "- Trusted Vercel subject: ${VERCEL_SUBJECT}"
            echo
            if [[ "$READY" == true ]]; then
              echo '### Google-side federation is ready'
              echo
              echo 'Configure these non-secret values in the Vercel production environment:'
              echo
              echo "- GCP_WIF_AUDIENCE=${WIF_AUDIENCE}"
              echo "- GCP_WIF_SERVICE_ACCOUNT=${GATEWAY_SERVICE_ACCOUNT}"
              echo "- CLOUD_RUN_BACKEND_URL=${SERVICE_URL}"
            else
              echo '### Google-side federation still needs an IAM administrator'
              echo
              echo 'The GitHub deployment identity intentionally does not have project-wide IAM administration. No broader role was granted automatically.'
              echo
              for blocker in "${BLOCKERS[@]}"; do
                echo "- ${blocker}"
              done
              echo
              echo 'After an IAM administrator performs the listed one-time action(s), rerun this workflow. Cloud Run remains private meanwhile.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ "$READY" == true ]]; then
            echo "WIF_READY=true"
            echo "GCP_WIF_AUDIENCE=$WIF_AUDIENCE"
            echo "GCP_WIF_SERVICE_ACCOUNT=$GATEWAY_SERVICE_ACCOUNT"
            echo "CLOUD_RUN_BACKEND_URL=$SERVICE_URL"
          else
            echo "::error::WIF is not fully provisioned because the deployment service account lacks IAM-admin permissions. See the job summary for the exact one-time action required."
            exit 1
          fi

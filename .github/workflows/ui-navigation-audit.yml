name: Read-only UI navigation audit

on:
  pull_request:
    paths:
      - 'scripts/auditReadOnlyNavigation.mjs'
      - '.github/workflows/ui-navigation-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-click-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      AUDIT_TARGET_URL: https://costaricatours2026.vercel.app
      AUDIT_OUT_DIR: artifacts/navigation-audit
    steps:
      - name: Check out audit scripts
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install isolated browser audit tooling
        run: npm install --no-save --package-lock=false playwright

      - name: Install Playwright Chromium for click-through checks
        run: npx playwright install --with-deps chromium

      - name: Navigate all declared public routes and perform safe clicks
        run: node scripts/auditReadOnlyNavigation.mjs

      - name: Publish click and scroll audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: read-only-ui-audit-${{ github.run_id }}
          path: artifacts/navigation-audit/
          if-no-files-found: warn
          retention-days: 14

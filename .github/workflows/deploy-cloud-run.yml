name: Deploy to Google Cloud Run

# Producción se despliega únicamente después de que el gate principal
# Build & Type Check termine exitosamente en main. workflow_dispatch se
# conserva para recuperación manual.
on:
  workflow_run:
    workflows: ["Build & Type Check"]
    types: [completed]
  workflow_dispatch: {}

env:
  SERVICE_NAME: costa-rica-tours
  REGION: us-central1
  PROJECT_ID: gen-lang-client-0782739149
  # Ruta preferida: Workload Identity Federation (OIDC sin llave persistente).
  # Compatibilidad: si aún no existen estos secretos, se usa GCP_SA_KEY.
  GCP_WIF_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
  GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
  GCP_SA_KEY_JSON: ${{ secrets.GCP_SA_KEY }}

permissions:
  contents: read
  id-token: write

concurrency:
  group: production-cloud-run-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Desplegar SHA validado a Cloud Run
    runs-on: ubuntu-latest
    timeout-minutes: 35
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    steps:
      - name: Resolver SHA de despliegue
        id: deploy_ref
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            echo "sha=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          fi

      - name: Descargar exactamente el código validado
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.deploy_ref.outputs.sha }}

      - name: Autenticar con Google Cloud — OIDC keyless (preferido)
        if: env.GCP_WIF_PROVIDER != '' && env.GCP_SERVICE_ACCOUNT != ''
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}

      - name: Autenticar con Google Cloud — llave JSON (fallback temporal)
        if: env.GCP_WIF_PROVIDER == '' || env.GCP_SERVICE_ACCOUNT == ''
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ env.GCP_SA_KEY_JSON }}

      - name: Verificar que existe un método de autenticación configurado
        shell: bash
        run: |
          if [ -z "$GCP_WIF_PROVIDER" ] && [ -z "$GCP_SA_KEY_JSON" ]; then
            echo "::error::Configure GCP_WORKLOAD_IDENTITY_PROVIDER + GCP_SERVICE_ACCOUNT (recomendado) o GCP_SA_KEY como fallback."
            exit 1
          fi

      - name: Configurar gcloud CLI
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Preflight manual — contratos, tipos y build
        if: github.event_name == 'workflow_dispatch'
        run: |
          npm ci --include=optional --legacy-peer-deps
          npm run audit:security:prod
          npm run audit:whatsapp
          npm run test:contracts
          npm run lint
          npm run build
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
          GEMINI_API_KEY: "ci-dummy-key"
          STRIPE_SECRET_KEY: "sk_test_dummy"
          VITE_STRIPE_PUBLIC_KEY: "pk_test_dummy"
          VITE_GOOGLE_MAPS_API_KEY: "dummy-key"

      - name: Desplegar código validado en Cloud Run
        run: |
          echo "Desplegando SHA ${{ steps.deploy_ref.outputs.sha }} en Cloud Run..."
          gcloud run deploy "$SERVICE_NAME" \
            --source . \
            --region "$REGION" \
            --project "$PROJECT_ID" \
            --min-instances=0 \
            --max-instances=20 \
            --memory=512Mi \
            --cpu=1 \
            --quiet

      - name: Verificar revisión, SHA y endpoint de salud
        run: |
          SERVICE_URL="$(gcloud run services describe "$SERVICE_NAME" --region "$REGION" --project "$PROJECT_ID" --format='value(status.url)')"
          REVISION="$(gcloud run services describe "$SERVICE_NAME" --region "$REGION" --project "$PROJECT_ID" --format='value(status.latestReadyRevisionName)')"
          echo "Servicio desplegado: $SERVICE_URL"
          echo "Revisión activa: $REVISION"
          echo "SHA desplegado: ${{ steps.deploy_ref.outputs.sha }}"
          ID_TOKEN="$(gcloud auth print-identity-token)"
          curl --fail --silent --show-error --retry 5 --retry-delay 5 --retry-all-errors \
            -H "Authorization: Bearer $ID_TOKEN" \
            "$SERVICE_URL/api/health"
          echo
          echo "✅ Cloud Run respondió correctamente al health check autenticado."

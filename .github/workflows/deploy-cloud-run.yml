name: Deploy to Google Cloud Run

# PAUSA PERMANENTE DURANTE LA ETAPA DE DESARROLLO A COSTO CERO.
# Se conserva el workflow para auditoría y recuperación futura; no ejecuta
# autenticación, builds ni despliegues. No activar GCP ni modificar esta pausa
# sin autorización escrita del propietario y revisión explícita de costos.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deshabilitado por política de costo cero
    runs-on: ubuntu-latest
    if: false
    steps:
      - name: Despliegue bloqueado
        run: |
          echo "::notice::Cloud Run está pausado durante el desarrollo a costo cero."
          echo "::notice::No se ejecutó autenticación, build ni despliegue."

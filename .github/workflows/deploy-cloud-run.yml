name: Deploy to Google Cloud Run

# Se ejecuta automáticamente cada vez que hay un push a "main".
# También se puede lanzar manualmente desde la pestaña "Actions" de GitHub.
# Este workflow solo se encarga del despliegue; no modifica el código de la aplicación.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

env:
  # Nombre del servicio en Cloud Run y región donde vive.
  # San José, Costa Rica está más cerca de la región "us-central1"
  # (Iowa) que de otras opciones de Google Cloud en Latinoamérica
  # limitadas; es una de las regiones más económicas y estables.
  SERVICE_NAME: costa-rica-tours
  REGION: us-central1
  PROJECT_ID: gen-lang-client-0782739149

permissions:
  contents: read
  id-token: write

concurrency:
  group: production-cloud-run-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build y despliegue a Cloud Run
    runs-on: ubuntu-latest
    # No se usa "if" con secrets aquí. GitHub no permite usar directamente
    # el contexto "secrets" en la condición de un job. Si faltan los secretos,
    # el propio paso de autenticación mostrará el error correspondiente.
    steps:
      - name: Descargar el código del repositorio
        uses: actions/checkout@v7

      - name: Autenticar con Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: "${{ secrets.GCP_SA_KEY }}"

      - name: Configurar gcloud CLI
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Preflight — verificar tipos y compilación antes de desplegar
        run: |
          npm ci --include=optional
          npm run lint
          npm run build
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
          GEMINI_API_KEY: "ci-dummy-key"
          STRIPE_SECRET_KEY: "sk_test_dummy"
          VITE_STRIPE_PUBLIC_KEY: "pk_test_dummy"
          VITE_GOOGLE_MAPS_API_KEY: "dummy-key"

      - name: Desplegar directamente desde el código en Cloud Run
        run: |
          echo "Iniciando despliegue en Google Cloud Run..."
          gcloud run deploy "$SERVICE_NAME" \
            --source . \
            --region "$REGION" \
            --project "$PROJECT_ID" \
            --min-instances=0 \
            --max-instances=3 \
            --memory=512Mi \
            --cpu=1 \
            --quiet

      - name: Verificar revisión y endpoint de salud
        run: |
          SERVICE_URL="$(gcloud run services describe "${{ env.SERVICE_NAME }}" --region "${{ env.REGION }}" --format='value(status.url)')"
          echo "Servicio desplegado: $SERVICE_URL"
          echo "Revisión activa: $(gcloud run services describe "${{ env.SERVICE_NAME }}" --region "${{ env.REGION }}" --format='value(status.latestReadyRevisionName)')"
          ID_TOKEN="$(gcloud auth print-identity-token)"
          curl --fail --silent --show-error --retry 5 --retry-delay 5 --retry-all-errors \
            -H "Authorization: Bearer $ID_TOKEN" \
            "$SERVICE_URL/api/health"
          echo
          echo "✅ Cloud Run respondió correctamente al health check autenticado."

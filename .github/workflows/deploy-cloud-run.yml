name: Deploy to Google Cloud Run

# Se ejecuta automáticamente cada vez que hay un push a "main".
# También se puede lanzar manualmente desde la pestaña "Actions" de GitHub.
# Este workflow solo se encarga del despliegue; no modifica el código de la aplicación.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

env:
  # Nombre del servicio en Cloud Run y región donde vive.
  # San José, Costa Rica está más cerca de la región "us-central1"
  # (Iowa) que de otras opciones de Google Cloud en Latinoamérica
  # limitadas; es una de las regiones más económicas y estables.
  SERVICE_NAME: costa-rica-tours
  REGION: us-central1
  PROJECT_ID: ${{ fromJSON(secrets.GCP_SA_KEY).project_id }}
  MIN_INSTANCES: ${{ vars.CLOUD_RUN_MIN_INSTANCES || '0' }}
  MAX_INSTANCES: ${{ vars.CLOUD_RUN_MAX_INSTANCES || '20' }}

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Build y despliegue a Cloud Run
    runs-on: ubuntu-latest
    # No se usa "if" con secrets aquí. GitHub no permite usar directamente
    # el contexto "secrets" en la condición de un job. Si faltan los secretos,
    # el propio paso de autenticación mostrará el error correspondiente.
    steps:
      - name: Descargar el código del repositorio
        uses: actions/checkout@v7

      - name: Autenticar con Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: "${{ secrets.GCP_SA_KEY }}"

      - name: Configurar gcloud CLI
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Preflight de configuración
        run: |
          set -euo pipefail
          test -n "$PROJECT_ID" || { echo "::error::No se pudo determinar PROJECT_ID desde GCP_SA_KEY."; exit 1; }
          case "$MIN_INSTANCES" in (''|*[!0-9]*) echo "::error::CLOUD_RUN_MIN_INSTANCES inválido."; exit 1;; esac
          case "$MAX_INSTANCES" in (''|*[!0-9]*) echo "::error::CLOUD_RUN_MAX_INSTANCES inválido."; exit 1;; esac
          test "$MAX_INSTANCES" -ge "$MIN_INSTANCES" || { echo "::error::MAX_INSTANCES debe ser >= MIN_INSTANCES."; exit 1; }

      - name: Preflight de acceso a Cloud Run
        run: |
          set -euo pipefail
          echo "Validando acceso de la identidad de despliegue al servicio $SERVICE_NAME..."
          if ! gcloud run services describe "$SERVICE_NAME" \
            --region "$REGION" \
            --project "$PROJECT_ID" \
            --format='value(metadata.name)' >/dev/null 2>&1; then
            echo "::error::La identidad de GitHub no puede leer el servicio Cloud Run '$SERVICE_NAME'. Falta al menos run.services.get y/o acceso de despliegue. Corrija IAM y vuelva a ejecutar el workflow."
            echo "::error::Para despliegue desde source, Google Cloud documenta Cloud Run Source Developer + Service Usage Consumer + Service Account User; además el servicio de Cloud Build necesita Cloud Run Builder."
            exit 1
          fi

      - name: Desplegar directamente desde el código en Cloud Run
        run: |
          echo "Iniciando despliegue en Google Cloud Run..."
          gcloud run deploy "$SERVICE_NAME" \
            --source . \
            --region "$REGION" \
            --project "$PROJECT_ID" \
            --allow-unauthenticated \
            --min-instances="$MIN_INSTANCES" \
            --max-instances="$MAX_INSTANCES" \
            --quiet

      - name: Mostrar la URL del servicio desplegado
        run: |
          echo "✅ Desplegado en: $(gcloud run services describe ${{ env.SERVICE_NAME }} --region ${{ env.REGION }} --format='value(status.url)')"

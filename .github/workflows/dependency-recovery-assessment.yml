name: Dependency recovery assessment
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/dependency-recovery-assessment.yml']
permissions:
  contents: read
jobs:
  assess:
    if: github.head_ref == 'fix/payment-gateway-release-recovery-20260930' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Resolve compatible security updates without executing package scripts
        shell: bash
        run: |
          cp package-lock.json /tmp/crt-original-lock.json
          npm audit fix --package-lock-only --ignore-scripts --legacy-peer-deps || true
          npm audit --omit=dev --json > /tmp/crt-audit.json || true
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const old = JSON.parse(fs.readFileSync('/tmp/crt-original-lock.json', 'utf8'));
          const updated = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          for (const [key, value] of Object.entries(updated.packages)) {
            if (JSON.stringify(old.packages[key]) !== JSON.stringify(value)) console.log('CRT_LOCK_CHANGE ' + JSON.stringify({key, value}));
          }
          for (const key of Object.keys(old.packages)) {
            if (!(key in updated.packages)) console.log('CRT_LOCK_REMOVE ' + JSON.stringify(key));
          }
          console.log('CRT_AUDIT ' + fs.readFileSync('/tmp/crt-audit.json', 'utf8').replace(/\n/g, ''));
          NODE
          npm view @grpc/grpc-js@1.14.5 version dist dependencies --json

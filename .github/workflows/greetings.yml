name: Greetings

on: [pull_request_target, issues]

jobs:
  greeting:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - uses: actions/first-interaction@v3
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          issue_message: "Gracias por abrir tu primer issue en CostaRicaTours2026. Revisaremos el contexto técnico antes de aplicar cambios para preservar los flujos existentes."
          pr_message: "Gracias por tu primer pull request en CostaRicaTours2026. Validaremos integración, build y comportamiento antes de incorporarlo a producción."

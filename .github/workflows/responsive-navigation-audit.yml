name: Responsive navigation audit

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/auditResponsiveNavigation.mjs'
      - '.github/workflows/responsive-navigation-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  responsive:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      AUDIT_TARGET_URL: http://127.0.0.1:4173
      AUDIT_OUT_DIR: artifacts/responsive-navigation
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --include=optional --legacy-peer-deps
      - name: Install Playwright Chromium
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium
      - name: Build branch
        run: npm run build
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'
          GEMINI_API_KEY: ci-dummy-key
          STRIPE_SECRET_KEY: sk_test_dummy
          VITE_STRIPE_PUBLIC_KEY: pk_test_dummy
          VITE_GOOGLE_MAPS_API_KEY: dummy-key
      - name: Start local frontend preview
        run: |
          npx vite preview --host 127.0.0.1 --port 4173 > /tmp/crt-vite-preview.log 2>&1 &
          echo $! > /tmp/crt-vite-preview.pid
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/crt-vite-preview.log
          exit 1
      - name: Navigate all responsive viewports
        run: node scripts/auditResponsiveNavigation.mjs
      - name: Upload responsive evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: responsive-navigation-${{ github.run_id }}
          path: artifacts/responsive-navigation/
          if-no-files-found: warn
          retention-days: 14

name: Upgrade Google GenAI 2.24 on latest main v3

on:
  push:
    branches:
      - chore/genai-2.24-latest-main-v3

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install current dependency graph
        run: npm ci
      - name: Upgrade Google GenAI SDK to 2.24
        run: npm install @google/genai@^2.24.0 --save-exact=false
      - name: Reinstall from updated lockfile
        run: npm ci
      - name: Remove one-shot workflow from final tree
        run: rm .github/workflows/upgrade-genai-224-v3.yml
      - name: Type check
        run: npm run lint
      - name: Contract tests
        run: npm run test:contracts
      - name: Build
        run: npm run build
      - name: Security audit gate
        run: npm run audit:security:prod
      - name: Verify diff hygiene
        run: git diff --check
      - name: Commit dependency update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json .github/workflows/upgrade-genai-224-v3.yml
          if git diff --cached --quiet; then
            echo 'No dependency changes to commit.'
            exit 0
          fi
          git commit -m 'chore(ai): upgrade Google GenAI SDK to 2.24'
          git push

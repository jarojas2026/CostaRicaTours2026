name: Operational scheduler hardening

on:
  push:
    branches:
      - fix/operational-scheduler-hardening-20260930

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Apply least-privilege scheduler hardening
        shell: bash
        run: |
          cat > backend/internalJobAuth.ts <<'EOF'
          import crypto from 'node:crypto';

          /**
           * Constant-time application credential validation for internal jobs.
           * Cloud Scheduler may use Authorization for Cloud Run OIDC, so the
           * application token can travel independently in X-CRT-Internal-Token.
           */
          export function hasInternalJobToken(
            headers: Record<string, string | string[] | undefined>,
            configured: string | undefined
          ): boolean {
            if (!configured) return false;
            const schedulerToken = headers['x-crt-internal-token'];
            const authorization = headers.authorization;
            const provided = typeof schedulerToken === 'string'
              ? schedulerToken.trim()
              : typeof authorization === 'string' && authorization.startsWith('Bearer ')
                ? authorization.slice(7).trim()
                : '';
            if (!provided) return false;
            const expected = Buffer.from(configured);
            const actual = Buffer.from(provided);
            return actual.length === expected.length && crypto.timingSafeEqual(actual, expected);
          }
          EOF

          cat > scripts/configureOperationalScheduler.ts <<'EOF'
          import { spawnSync } from 'node:child_process';
          import { pathToFileURL } from 'node:url';

          type Environment = Record<string, string | undefined>;

          export function schedulerPlan(env: Environment) {
            const required = (name: string) => {
              const value = String(env[name] || '').trim();
              if (!value) throw new Error(`Missing configuration: ${name}`);
              return value;
            };

            const project = required('GOOGLE_CLOUD_PROJECT');
            const location = required('SCHEDULER_REGION');
            const serviceAccount = required('SCHEDULER_SERVICE_ACCOUNT');
            const base = new URL(required('CLOUD_RUN_BACKEND_URL'));
            if (
              base.protocol !== 'https:' ||
              !base.hostname.endsWith('.run.app') ||
              base.username || base.password || base.search || base.hash || base.pathname !== '/'
            ) {
              throw new Error('CLOUD_RUN_BACKEND_URL must be the canonical HTTPS Cloud Run service origin.');
            }
            if (!serviceAccount.endsWith(`@${project}.iam.gserviceaccount.com`)) {
              throw new Error('Scheduler identity must be an explicit service account in the configured project.');
            }

            const origin = base.origin;
            const definitions = [
              ['crt-customer-intake', '/api/internal/customer-intake/process', 'CUSTOMER_INTAKE_JOB_TOKEN'],
              ['crt-reservation-lifecycle', '/api/internal/reservation-lifecycle/sweep', 'AGENT_INTERNAL_TOKEN'],
              ['crt-provider-inbox', '/api/internal/provider-inbox/sweep', 'AGENT_INTERNAL_TOKEN'],
              ['crt-email-operations', '/api/internal/email-operations/sweep', 'AGENT_INTERNAL_TOKEN'],
            ] as const;

            return definitions.map(([name, path, tokenName]) => {
              const token = required(tokenName);
              if (/[\r\n,]/.test(token)) throw new Error(`Invalid HTTP header characters in ${tokenName}`);
              return {
                name,
                project,
                location,
                uri: origin + path,
                origin,
                serviceAccount,
                token,
                tokenName,
                schedule: '* * * * *',
              };
            });
          }

          export function schedulerArgs(job: ReturnType<typeof schedulerPlan>[number], update: boolean) {
            return [
              'scheduler', 'jobs', update ? 'update' : 'create', 'http', job.name,
              '--project', job.project,
              '--location', job.location,
              '--schedule', job.schedule,
              '--time-zone', 'America/Costa_Rica',
              '--uri', job.uri,
              '--http-method', 'POST',
              update ? '--update-headers' : '--headers',
              `Content-Type=application/json,X-CRT-Internal-Token=${job.token}`,
              '--message-body', '{"limit":10}',
              '--oidc-service-account-email', job.serviceAccount,
              '--oidc-token-audience', job.origin,
              '--attempt-deadline', '180s',
              '--max-retry-attempts', '2',
              '--min-backoff', '10s',
              '--max-backoff', '60s',
              '--quiet',
              '--format=none',
            ];
          }

          function main() {
            const jobs = schedulerPlan(process.env);
            const apply = process.argv.includes('--apply');
            console.log(JSON.stringify({
              apply,
              jobs: jobs.map(({ token, ...job }) => job),
            }, null, 2));
            if (!apply) return;

            for (const job of jobs) {
              const existing = spawnSync('gcloud', [
                'scheduler', 'jobs', 'describe', job.name,
                '--project', job.project,
                '--location', job.location,
                '--format=json',
              ], { encoding: 'utf8' });
              if (existing.error) throw new Error('gcloud is unavailable.');
              const update = existing.status === 0;
              if (!update && !/NOT_FOUND|not found/i.test(existing.stderr)) {
                throw new Error(`Cannot inspect scheduler job ${job.name}; check API and IAM access.`);
              }
              if (update) {
                const current = JSON.parse(existing.stdout);
                if (current.httpTarget?.uri !== job.uri) {
                  throw new Error(`Existing job ${job.name} targets a different endpoint; review it before updating.`);
                }
              }
              const result = spawnSync('gcloud', schedulerArgs(job, update), { encoding: 'utf8' });
              if (result.error || result.status !== 0) {
                throw new Error(`Failed to configure ${job.name}; check Cloud Scheduler/IAM audit logs. No secret output was printed.`);
              }
              console.log(`Configured ${job.name}; verify executions and Cloud Run logs before declaring it operational.`);
            }
          }

          if (process.argv[1] && import.meta.url === pathToFileURL(process.argv[1]).href) {
            try { main(); }
            catch (error) {
              console.error(error instanceof Error ? error.message : 'Scheduler configuration failed');
              process.exitCode = 1;
            }
          }
          EOF

          cat > tests/internalJobAuth.test.ts <<'EOF'
          import assert from 'node:assert/strict';
          import test from 'node:test';
          import { hasInternalJobToken } from '../backend/internalJobAuth';
          import { schedulerPlan, schedulerArgs } from '../scripts/configureOperationalScheduler';

          test('internal jobs support separate OIDC and application credentials without failing open', () => {
            assert.equal(hasInternalJobToken({ authorization: 'Bearer app-token' }, 'app-token'), true);
            assert.equal(hasInternalJobToken({ authorization: 'Bearer oidc-token', 'x-crt-internal-token': 'app-token' }, 'app-token'), true);
            assert.equal(hasInternalJobToken({ authorization: 'Bearer oidc-token' }, 'app-token'), false);
            assert.equal(hasInternalJobToken({ 'x-crt-internal-token': 'app-token' }, undefined), false);
            assert.equal(hasInternalJobToken({ 'x-crt-internal-token': ['app-token'] }, 'app-token'), false);
            assert.equal(hasInternalJobToken({ authorization: 'Bearer wrong' }, 'app-token'), false);
            assert.equal(hasInternalJobToken({ authorization: 'Bearer é' }, 'a'), false);
          });

          test('scheduler targets only canonical private Cloud Run endpoints and bounds retries', () => {
            const env = {
              GOOGLE_CLOUD_PROJECT: 'test-project',
              SCHEDULER_REGION: 'us-central1',
              SCHEDULER_SERVICE_ACCOUNT: 'scheduler@test-project.iam.gserviceaccount.com',
              CLOUD_RUN_BACKEND_URL: 'https://test-service.run.app',
              CUSTOMER_INTAKE_JOB_TOKEN: 'intake-test',
              AGENT_INTERNAL_TOKEN: 'agent-test',
            };
            const jobs = schedulerPlan(env);
            assert.equal(jobs.length, 4);
            assert.equal(new Set(jobs.map(job => job.uri)).size, 4);
            assert.equal(jobs[0].token, 'intake-test');
            assert.equal(jobs[1].token, 'agent-test');
            const args = schedulerArgs(jobs[0], false);
            assert.equal(args[args.indexOf('--oidc-token-audience') + 1], env.CLOUD_RUN_BACKEND_URL);
            assert.equal(args[args.indexOf('--max-retry-attempts') + 1], '2');
            assert.ok(schedulerArgs(jobs[0], true).includes('--update-headers'));
            assert.throws(() => schedulerPlan({ ...env, CLOUD_RUN_BACKEND_URL: 'https://unrelated.example' }));
            assert.throws(() => schedulerPlan({ ...env, CLOUD_RUN_BACKEND_URL: 'https://test-service.run.app/path' }));
            assert.throws(() => schedulerPlan({ ...env, AGENT_INTERNAL_TOKEN: '' }));
            assert.throws(() => schedulerPlan({ ...env, AGENT_INTERNAL_TOKEN: 'invalid,header' }));
          });
          EOF

          python - <<'PY'
          from pathlib import Path
          import json

          server = Path('server.ts')
          text = server.read_text()

          marker = "import { handleStripeWebhook, handlePayPalWebhook } from './backend/paymentWebhookHttpService';\n"
          addition = marker + "import { hasInternalJobToken } from './backend/internalJobAuth';\n"
          if "./backend/internalJobAuth" not in text:
              if marker not in text:
                  raise SystemExit('payment webhook import marker not found')
              text = text.replace(marker, addition, 1)

          old = """  const authorization = req.headers.authorization;\n  const provided = authorization?.startsWith('Bearer ') ? authorization.slice(7).trim() : '';\n  if (!provided) return res.status(401).json({ error: 'Autenticación requerida.' });\n  const expectedBuffer = Buffer.from(configured);\n  const providedBuffer = Buffer.from(provided);\n  if (expectedBuffer.length !== providedBuffer.length || !crypto.timingSafeEqual(expectedBuffer, providedBuffer)) {\n    return res.status(401).json({ error: 'No autorizado.' });\n  }\n"""
          new = """  if (!hasInternalJobToken(req.headers as Record<string, string | string[] | undefined>, configured)) {\n    return res.status(401).json({ error: 'No autorizado.' });\n  }\n"""
          if old not in text:
              raise SystemExit('requireAgentTool auth block not found')
          text = text.replace(old, new, 1)

          old = """  const configured = process.env.CUSTOMER_INTAKE_JOB_TOKEN;\n  const authorization = String(req.headers.authorization || '');\n  const provided = authorization.startsWith('Bearer ') ? authorization.slice(7).trim() : '';\n  if (!configured || !provided || provided.length !== configured.length ||\n      !crypto.timingSafeEqual(Buffer.from(provided), Buffer.from(configured))) {\n    return res.status(401).json({ success: false, error: 'No autorizado.' });\n  }\n  try {\n    const result = await processPendingCustomerIntakeJobs(Number(req.body?.limit || 10));\n    return res.json({ success: true, ...result });\n"""
          new = """  const configured = process.env.CUSTOMER_INTAKE_JOB_TOKEN;\n  if (!hasInternalJobToken(req.headers as Record<string, string | string[] | undefined>, configured)) {\n    return res.status(401).json({ success: false, error: 'No autorizado.' });\n  }\n  try {\n    const result = await withDistributedAutomationLock(\n      'customer-intake-worker-5s',\n      () => processPendingCustomerIntakeJobs(Number(req.body?.limit || 10))\n    );\n    if (!result) return res.status(409).json({ success: false, error: 'automation_lock_busy' });\n    return res.json({ success: true, ...result });\n"""
          if old not in text:
              raise SystemExit('customer intake internal route block not found')
          text = text.replace(old, new, 1)

          replacements = {
            "res.json({ success: true, result: await processProviderInboxOnce() });": "res.json({ success: true, result: await withDistributedAutomationLock('provider-inbox-1m', processProviderInboxOnce) });",
            "res.json({ success: true, result: await processEmailOperationsOnce() });": "res.json({ success: true, result: await withDistributedAutomationLock('email-operations-1m', processEmailOperationsOnce) });",
            "try { res.json({ success: true, result: await runReservationLifecycleSweep(100) }); }": "try { res.json({ success: true, result: await withDistributedAutomationLock('reservation-lifecycle-1m', () => runReservationLifecycleSweep(100)) }); }",
          }
          for old_value, new_value in replacements.items():
              if old_value not in text:
                  raise SystemExit(f'route marker not found: {old_value[:60]}')
              text = text.replace(old_value, new_value)

          server.write_text(text)

          package_path = Path('package.json')
          package = json.loads(package_path.read_text())
          scripts = package.setdefault('scripts', {})
          scripts['check:release'] = "npm run audit:security:prod && node scripts/securityFixtureAudit.mjs && npm run audit:whatsapp && npm run test:contracts && node --max-old-space-size=4096 node_modules/typescript/bin/tsc --noEmit && npm run build"
          scripts['ops:scheduler:plan'] = "tsx scripts/configureOperationalScheduler.ts"
          scripts['ops:scheduler:apply'] = "tsx scripts/configureOperationalScheduler.ts --apply"
          package_path.write_text(json.dumps(package, indent=2, ensure_ascii=False) + '\n')

          env_path = Path('.env.example')
          env = env_path.read_text()
          marker = 'CUSTOMER_INTAKE_JOB_TOKEN=""\n'
          scheduler = '''CUSTOMER_INTAKE_JOB_TOKEN=""\n\n# Cloud Scheduler -> private Cloud Run automation sweeps (dedicated least-privilege identity)\nSCHEDULER_REGION="us-central1"\nSCHEDULER_SERVICE_ACCOUNT=""\nCLOUD_RUN_BACKEND_URL=""\n'''
          if 'SCHEDULER_SERVICE_ACCOUNT=' not in env:
              if marker not in env:
                  raise SystemExit('customer intake env marker not found')
              env = env.replace(marker, scheduler, 1)
              env_path.write_text(env)
          PY

          rm .github/workflows/operational-scheduler-hardening.yml

      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npm run lint
      - name: Contract tests
        run: npm run test:contracts
      - name: Build
        run: npm run build
      - name: Production dependency audit
        run: npm run audit:security:prod
      - name: Release gate smoke
        run: npm run check:release
      - name: Verify diff hygiene
        run: git diff --check
      - name: Commit hardened scheduler integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server.ts backend/internalJobAuth.ts scripts/configureOperationalScheduler.ts tests/internalJobAuth.test.ts package.json .env.example .github/workflows/operational-scheduler-hardening.yml
          git commit -m 'fix(ops): harden scheduled automation with OIDC-safe app auth and distributed locks'
          git push

name: Provider truth-plane patch

on:
  push:
    branches:
      - fix/provider-truth-plane-2026-09-28

permissions:
  contents: write

jobs:
  apply-provider-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply fail-closed patch
        run: python3 scripts/providerTruthPlanePatch.py

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Validate build
        run: |
          npm ci
          npm run build

      - name: Commit verified patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/provider-truth-plane-patch.yml scripts/providerTruthPlanePatch.py
          git add backend/nativeWorkflows.ts server.ts tests/providerTruthPlane.contract.test.ts
          git commit -m "fix: fail closed on unverified provider routing"
          git push origin HEAD:fix/provider-truth-plane-2026-09-28

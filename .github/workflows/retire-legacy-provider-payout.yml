name: Retire legacy provider payout

on:
  push:
    branches:
      - fix/provider-truth-plane-2026-09-28

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: contains(github.event.head_commit.message, 'execute legacy payout retirement safely')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply exact payout retirement patch
        run: python3 scripts/retireLegacyProviderPayout.py

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Verify contracts, types and build
        run: |
          npm ci --include=optional
          npm run test:contracts
          npm run lint
          npm run build

      - name: Commit verified change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/retire-legacy-provider-payout.yml scripts/retireLegacyProviderPayout.py
          git add backend/nativeWorkflows.ts server.ts tests/providerTruthPlane.contract.test.ts
          git commit -m "fix: retire unsafe legacy provider payout path"
          git push origin HEAD:fix/provider-truth-plane-2026-09-28

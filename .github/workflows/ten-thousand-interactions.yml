name: 10,000 public browser interactions

on:
  pull_request:
    paths:
      - 'scripts/auditTenThousandInteractions.mjs'
      - '.github/workflows/ten-thousand-interactions.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      AUDIT_TARGET_URL: https://costaricatours2026.vercel.app
      AUDIT_OUT_DIR: artifacts/ten-thousand-interactions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated Playwright
        run: npm install --no-save --package-lock=false playwright
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Perform and count 10,000 actual read-only browser actions
        run: node scripts/auditTenThousandInteractions.mjs
      - name: Publish evidence and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ten-thousand-browser-interactions-${{ github.run_id }}
          path: artifacts/ten-thousand-interactions/
          if-no-files-found: warn
          retention-days: 14

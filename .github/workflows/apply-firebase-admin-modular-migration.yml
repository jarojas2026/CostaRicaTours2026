name: Apply Firebase Admin modular runtime migration

on:
  push:
    branches:
      - fix/firebase-admin-modular-runtime
    paths:
      - .github/workflows/apply-firebase-admin-modular-migration.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/firebase-admin-modular-runtime
          fetch-depth: 0

      - name: Migrate Firebase Admin runtime to modular APIs
        shell: python
        run: |
          from pathlib import Path

          helper = Path('backend/firebaseAdminRuntime.ts')
          helper.write_text("""import {
            applicationDefault,
            cert,
            getApp,
            getApps,
            initializeApp,
            type App,
          } from 'firebase-admin/app';
          import { getAuth, type Auth } from 'firebase-admin/auth';

          let cachedApp: App | null = null;
          let cachedAuth: Auth | null = null;

          function projectId(): string | undefined {
            return String(process.env.FIREBASE_PROJECT_ID || process.env.GOOGLE_CLOUD_PROJECT || process.env.GCLOUD_PROJECT || '').trim() || undefined;
          }

          /**
           * Single Firebase Admin app for server-side services.
           * Google-hosted production uses Application Default Credentials from
           * the Cloud Run service identity. A JSON credential remains supported
           * only for explicit non-Google compatibility environments.
           */
          export function getFirebaseAdminApp(): App {
            if (cachedApp) return cachedApp;
            if (getApps().length > 0) {
              cachedApp = getApp();
              return cachedApp;
            }

            const explicitProjectId = projectId();
            const rawServiceAccount = String(process.env.FIREBASE_SERVICE_ACCOUNT || '').trim();
            if (rawServiceAccount) {
              const serviceAccount = JSON.parse(rawServiceAccount);
              cachedApp = initializeApp({
                credential: cert(serviceAccount),
                ...(explicitProjectId ? { projectId: explicitProjectId } : {}),
              });
              return cachedApp;
            }

            cachedApp = initializeApp({
              credential: applicationDefault(),
              ...(explicitProjectId ? { projectId: explicitProjectId } : {}),
            });
            return cachedApp;
          }

          export function getFirebaseAdminAuth(): Auth {
            if (!cachedAuth) cachedAuth = getAuth(getFirebaseAdminApp());
            return cachedAuth;
          }
          """, encoding='utf-8')

          booking_path = Path('backend/bookingService.ts')
          booking = booking_path.read_text(encoding='utf-8')
          old_import = "import admin from 'firebase-admin';\n"
          if old_import not in booking:
            raise SystemExit('Expected legacy firebase-admin import not found in bookingService.ts')
          booking = booking.replace(old_import, "import { getFirebaseAdminApp } from './firebaseAdminRuntime';\n", 1)

          old_block = """export function getFirestoreDb(): Firestore | null {
            if (dbInstance) return dbInstance;

            try {
              const adminAny = admin as any;
              if (!adminAny.apps || adminAny.apps.length === 0) {
                if (process.env.FIREBASE_SERVICE_ACCOUNT) {
                  adminAny.initializeApp({
                    credential: adminAny.credential.cert(JSON.parse(process.env.FIREBASE_SERVICE_ACCOUNT)),
                    projectId: process.env.FIREBASE_PROJECT_ID
                  });
                } else {
                  adminAny.initializeApp();
                }
              }

              try {
                dbInstance = getFirestore(adminAny.app(), FIRESTORE_DATABASE_ID);
              } catch {
                dbInstance = getFirestore(adminAny.app());
              }

              return dbInstance;
            } catch (error) {
              console.warn('⚠️ Firestore Admin no disponible.');
              return null;
            }
          }
          """
          new_block = """export function getFirestoreDb(): Firestore | null {
            if (dbInstance) return dbInstance;

            try {
              const app = getFirebaseAdminApp();
              dbInstance = getFirestore(app, FIRESTORE_DATABASE_ID);
              return dbInstance;
            } catch (error: any) {
              console.warn('⚠️ Firestore Admin no disponible.', {
                name: error?.name || null,
                code: error?.code || null,
                message: error?.message || String(error)
              });
              return null;
            }
          }
          """
          if old_block not in booking:
            raise SystemExit('Expected legacy getFirestoreDb block not found')
          booking = booking.replace(old_block, new_block, 1)
          booking_path.write_text(booking, encoding='utf-8')

          auth_path = Path('backend/authMiddleware.ts')
          auth = auth_path.read_text(encoding='utf-8')
          legacy_auth_import = "import admin from 'firebase-admin';\n"
          if legacy_auth_import not in auth:
            raise SystemExit('Expected legacy firebase-admin import not found in authMiddleware.ts')
          auth = auth.replace(legacy_auth_import, "import { getFirebaseAdminAuth } from './firebaseAdminRuntime';\n", 1)
          old_auth_block = """      const adminAny = admin as any;
                if (!adminAny.apps || adminAny.apps.length === 0) adminAny.initializeApp();
                const token = authorization.slice('Bearer '.length).trim();
                const decoded = await adminAny.auth().verifyIdToken(token);
          """
          new_auth_block = """      const token = authorization.slice('Bearer '.length).trim();
                const decoded = await getFirebaseAdminAuth().verifyIdToken(token);
          """
          if old_auth_block not in auth:
            raise SystemExit('Expected legacy auth initialization block not found')
          auth = auth.replace(old_auth_block, new_auth_block, 1)
          auth_path.write_text(auth, encoding='utf-8')

          test_path = Path('tests/firebaseAdminRuntime.contract.test.ts')
          test_path.write_text("""import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import path from 'node:path';
          import test from 'node:test';

          const read = (relativePath: string) => fs.readFileSync(path.join(process.cwd(), relativePath), 'utf8');

          test('Firebase Admin runtime uses modular APIs and ADC on Google infrastructure', () => {
            const runtime = read('backend/firebaseAdminRuntime.ts');
            assert.match(runtime, /from 'firebase-admin\\/app'/);
            assert.match(runtime, /applicationDefault\\(\\)/);
            assert.match(runtime, /getApps\\(\\)/);
            assert.match(runtime, /from 'firebase-admin\\/auth'/);
          });

          test('bookingService uses the named Firestore database without silently falling back to default', () => {
            const booking = read('backend/bookingService.ts');
            assert.doesNotMatch(booking, /import admin from 'firebase-admin'/);
            assert.match(booking, /getFirestore\\(app, FIRESTORE_DATABASE_ID\\)/);
            assert.doesNotMatch(booking, /getFirestore\\(adminAny\\.app\\(\\)\\)/);
          });

          test('operator authentication shares the modular Firebase Admin app', () => {
            const auth = read('backend/authMiddleware.ts');
            assert.doesNotMatch(auth, /import admin from 'firebase-admin'/);
            assert.match(auth, /getFirebaseAdminAuth\\(\\)\\.verifyIdToken/);
          });
          """, encoding='utf-8')

          # This is a one-shot migration workflow; remove it from the resulting branch.
          Path('.github/workflows/apply-firebase-admin-modular-migration.yml').unlink()

      - name: Commit migrated runtime
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/firebaseAdminRuntime.ts backend/bookingService.ts backend/authMiddleware.ts tests/firebaseAdminRuntime.contract.test.ts .github/workflows/apply-firebase-admin-modular-migration.yml
          git commit -m "fix(firebase): use modular Admin SDK with Cloud Run ADC"
          git push origin HEAD:fix/firebase-admin-modular-runtime

name: Tico Insider - generar video
on:
  workflow_dispatch:
    inputs:
      tema:
        description: "Tema (vacio = siguiente de topics.txt)"
        required: false
      formato:
        description: "short o long"
        default: "short"
jobs:
  video:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tico-insider
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tico-insider
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: pip install -q edge-tts
      - name: Elegir tema
        id: tema
        run: |
          if [ -n "${{ github.event.inputs.tema }}" ]; then echo "t=${{ github.event.inputs.tema }}" >> $GITHUB_OUTPUT;
          else n=$(( 10#$(date +%j) % $(wc -l < topics.txt) + 1 )); echo "t=$(sed -n ${n}p topics.txt)" >> $GITHUB_OUTPUT; fi
      - name: Generar
        env:
          PIXABAY_KEY: ${{ secrets.PIXABAY_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python make_video.py "${{ steps.tema.outputs.t }}" "${{ github.event.inputs.formato || 'short' }}"
      - uses: actions/upload-artifact@v4
        with:
          name: video
          path: tico-insider/videos/
          retention-days: 7

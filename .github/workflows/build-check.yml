name: Build & Type Check

# Se ejecuta en cada push a main y en cada Pull Request hacia main.
# Objetivo: detectar errores de código ANTES de que lleguen a producción,
# sin depender de revisar manualmente cada cambio.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: build-check-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Instalar, verificar contratos, tipos y compilar
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Descargar el código del repositorio
        uses: actions/checkout@v7

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - name: Instalar dependencias
        run: npm ci --include=optional --legacy-peer-deps

      - name: Bloquear vulnerabilidades altas y críticas de producción
        # El endpoint de auditoría de npm a veces responde 4xx/5xx
        # (p. ej. 503 en /-/npm/v1/security/audits/quick). Reintentamos y,
        # si el REGISTRO sigue caído, solo dejamos un aviso; si npm audit
        # encuentra vulnerabilidades altas/críticas, el paso SÍ falla.
        run: |
          for intento in 1 2 3; do
            set +e
            timeout 180 npm run audit:security:prod > /tmp/npm-audit.log 2>&1
            code=$?
            set -e
            cat /tmp/npm-audit.log
            if [ "$code" -eq 0 ]; then exit 0; fi
            if [ "$code" -eq 124 ]; then echo "npm audit superó 180 s" >> /tmp/npm-audit.log; echo "ETIMEDOUT" >> /tmp/npm-audit.log; fi
            if ! grep -qiE "audit endpoint returned an error|ENOAUDIT|Service Unavailable|ETIMEDOUT|ECONNRESET|ECONNREFUSED|EAI_AGAIN|code E5[0-9][0-9]|code E4[0-9][0-9]" /tmp/npm-audit.log; then
              echo "::error::npm audit encontró vulnerabilidades altas o críticas de producción"
              exit "$code"
            fi
            echo "Endpoint de auditoría de npm falló (intento $intento/3); reintentando…"
            sleep 15
          done
          echo "::warning::El endpoint de auditoría de npm no respondió tras 3 intentos; auditoría omitida en esta ejecución"

      - name: Auditar fixtures y tokens mock
        run: node scripts/securityFixtureAudit.mjs

      - name: Auditar routing de WhatsApp y escalamiento IA
        run: npm run audit:whatsapp

      - name: Verificar contratos críticos del lifecycle y memoria organizativa
        run: npm run test:contracts

      - name: Verificar tipos de TypeScript (equivalente a "npm run lint")
        run: npm run lint
        env:
          # El proyecto creció lo suficiente para que tsc necesite más
          # memoria que el límite por defecto de Node — sin esto, el
          # chequeo de tipos falla con "JavaScript heap out of memory".
          NODE_OPTIONS: "--max-old-space-size=4096"

      - name: Compilar el proyecto (frontend + servidor)
        run: npm run build
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
          # Variables de entorno "falsas" solo para que la compilación no
          # falle por falta de claves reales. Esto NO despliega nada ni
          # usa dinero real — es solo para verificar que el código compila.
          GEMINI_API_KEY: "ci-dummy-key"
          STRIPE_SECRET_KEY: "sk_test_dummy"
          VITE_STRIPE_PUBLIC_KEY: "pk_test_dummy"
          VITE_GOOGLE_MAPS_API_KEY: "dummy-key"

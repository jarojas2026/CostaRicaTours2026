    <script>
      // Suppress benign [vite] websocket connection warning when HMR is intentionally disabled in AI Studio
      (function() {
        var origError = console.error;
        var origWarn = console.warn;
        console.error = function() {
          if (arguments[0] && typeof arguments[0] === 'string' && arguments[0].indexOf('[vite]') !== -1) return;
          origError.apply(console, arguments);
        };
        console.warn = function() {
          if (arguments[0] && typeof arguments[0] === 'string' && arguments[0].indexOf('[vite]') !== -1) return;
          origWarn.apply(console, arguments);
        };
      })();
    </script>

    <script>
      (function() {
        function isVite(arg) {
          if (!arg) return false;
          var str = '';
          try {
            if (typeof arg === 'string') str = arg;
            else if (arg.message) str = arg.message;
            else if (arg.stack) str = arg.stack;
            else str = String(arg);
          } catch(e) { return false; }
          return str.indexOf('[vite]') !== -1 || str.indexOf('vite-hmr') !== -1 || str.indexOf('failed to connect to websocket') !== -1;
        }
        function shouldSuppress(args) {
          for (var i = 0; i < args.length; i++) {
            if (isVite(args[i])) return true;
          }
          return false;
        }
        ['error', 'warn', 'log', 'info', 'debug'].forEach(function(method) {
          var orig = console[method];
          if (!orig) return;
          console[method] = function() {
            if (shouldSuppress(arguments)) return;
            orig.apply(console, arguments);
          };
        });
        window.addEventListener('error', function(e) {
          if (isVite(e.message) || isVite(e.error)) {
            e.stopImmediatePropagation();
            e.preventDefault();
          }
        }, true);
        window.addEventListener('unhandledrejection', function(e) {
          if (isVite(e.reason)) {
            e.stopImmediatePropagation();
            e.preventDefault();
          }
        }, true);
        if (typeof window !== 'undefined' && window.WebSocket) {
          var OrigWS = window.WebSocket;
          window.WebSocket = function(url, protocols) {
            if (protocols === 'vite-hmr' || (typeof url === 'string' && (url.indexOf('token=') !== -1 || url.indexOf('24678') !== -1))) {
              var listeners = {};
              var dummy = {
                readyState: 1,
                OPEN: 1,
                CLOSED: 3,
                CLOSING: 2,
                CONNECTING: 0,
                url: url,
                protocol: 'vite-hmr',
                addEventListener: function(evt, fn) {
                  if (!listeners[evt]) listeners[evt] = [];
                  listeners[evt].push(fn);
                  if (evt === 'open') {
                    setTimeout(function() {
                      try { fn({ type: 'open', target: dummy }); } catch(err) {}
                    }, 0);
                  }
                },
                removeEventListener: function(evt, fn) {
                  if (!listeners[evt]) return;
                  listeners[evt] = listeners[evt].filter(function(h) { return h !== fn; });
                },
                send: function() {},
                close: function() {
                  dummy.readyState = 3;
                }
              };
              return dummy;
            }
            return new OrigWS(url, protocols);
          };
          window.WebSocket.prototype = OrigWS.prototype;
          window.WebSocket.OPEN = OrigWS.OPEN || 1;
          window.WebSocket.CLOSED = OrigWS.CLOSED || 3;
          window.WebSocket.CLOSING = OrigWS.CLOSING || 2;
          window.WebSocket.CONNECTING = OrigWS.CONNECTING || 0;
        }
      })();
    </script>
